<!DOCTYPE html>
<html lang="th">
<head>
    <style>
      body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.container {
    width: 100vw;
    height: 100vh;
    padding: 20px;
    margin: 0;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: url('https://i.postimg.cc/ZRpJ11MC/Untitled-design-2.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.screen { 
    display: none !important; 
    width: 92%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    box-sizing: border-box;
    padding: 25px;
    background: rgba(255, 255, 255, 0.92); 
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15); 
}

#screen-1, #screen-2, #screen-3, #screen-4 {
    background-image: none !important;
}

.screen.active { 
    display: flex !important;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start !important;

button {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 16px 30px;
    margin: 10px 0;
    width: 100%;
    max-width: 550px;
    border-radius: 12px;
    font-size: 22px; 
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

button:hover { 
    background-color: #45a049; 
}
  
.quiz-img {
    width: 100%;
    max-width: 550px;
    max-height: 250px; 
    object-fit: contain;
    border-radius: 12px;
    margin: 12px 0;
    background-color: #fff;
    border: 1px solid #ddd;
}

#question-title {
    font-size: 24px !important; 
    font-weight: bold;
    color: #2c3e50;
    margin: 10px 0;
}

input[type="text"] {
    width: 100%;
    max-width: 550px;
    padding: 14px;
    font-size: 20px;
    margin: 10px 0;
    border: 2px solid #ccc;
    border-radius: 10px;
    text-align: center;
    box-sizing: border-box;
}

.board-map {
    display: grid;
    grid-template-columns: repeat(3, 85px);
    grid-template-rows: repeat(4, 60px);
    gap: 8px;
    justify-content: center;
    margin: 10px 0;
    background: rgba(255, 255, 255, 0.9);
    padding: 12px;
    border-radius: 12px;
}

.cell {
    background-color: #fff;
    border: 2px solid #ccc;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
    color: #333;
}

.player-avatar {
    width: 48px !important;
    height: 48px !important;
    object-fit: contain;
}

.timer {
    color: #d9534f;
    font-weight: bold;
    margin-bottom: 4px;
    font-size: 20px;
}

#screen-4 h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

#screen-4 p {
    font-size: 22px;
    margin: 8px 0;
}

#result-details {
    text-align: left;
    width: 100%;
    max-width: 550px;
    max-height: 220px;
    overflow-y: auto;
    margin: 15px 0;
    font-size: 18px; 
    background: #ffffff;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #ddd;
    box-sizing: border-box;
}
</style>
</head>

      <div class="container">
    <!-- หน้าที่ 1: หน้าเริ่มต้น -->
    <div id="screen-1" class="screen active">
        <h1> QUIZ BOARD GAME</h1>
        <p>มาทำโจทย์สนุกๆกัน!</p>
        <button onclick="goToScreen(2)">เริ่มเล่น</button>
    </div>

        <!-- หน้าที่ 2: หน้าเลือกหมวดหมู่ -->
    <div id="screen-2" class="screen">
        <h2>เลือกหมวดหมู่</h2>
        <button onclick="startQuiz('ฟิสิกส์')">ฟิสิกส์ (10 ข้อ)</button>
        <button onclick="startQuiz('อังกฤษ')">อังกฤษ (10 ข้อ)</button>
        <button onclick="startQuiz('คณิตศาสตร์')">คณิตศาสตร์ (10 ข้อ)</button>
        <button onclick="goToScreen(1)" style="background-color: #888;">ย้อนกลับ</button>
    </div>

        <!-- หน้าที่ 3: หน้าเล่นเกม (กระดาน 10 ช่อง) -->
    <div id="screen-3" class="screen">
        <div class="timer" id="timer-text">เวลา: 60 วินาที</div>
      
      <div class="board-map" id="board-grid">
            <div class="cell" id="cell-7">7</div>
            <div class="cell" id="cell-8">8</div>
            <div class="cell" id="cell-9">9</div>
            <div class="cell" id="cell-6">6</div>
            <div class="cell" style="border:none; background:none;"></div>
            <div class="cell" style="border:none; background:none;"></div>
            <div class="cell" id="cell-5">5</div>
            <div class="cell" id="cell-4">4</div>
            <div class="cell" id="cell-3">3</div>
            <div class="cell" style="border:none; background:none;"></div>
            <div class="cell" id="cell-2">2</div>
            <div class="cell" id="cell-1">1</div>
        </div>
        
        <h4 id="question-title" style="margin: 5px 0;">โจทย์ข้อที่ 1</h4>
        <img id="quiz-image" class="quiz-img" src="" alt="โจทย์รูปภาพ">
        <input type="text" id="answer-input" placeholder="พิมพ์คำตอบของคุณที่นี่...">
        <button onclick="submitAnswer()">ส่งคำตอบ</button>
    </div>

    <!-- หน้าที่ 4: หน้าสรุปผล -->
    <div id="screen-4" class="screen">
        <h2>🎉 คุณทำได้! 🎊</h2>
        <p id="total-time-text">เวลารวมทั้งหมด: 0 วินาที</p>
        <p id="wrong-count-text" style="font-weight: bold; color: #d9534f;">ตอบผิดทั้งหมด: 0 ครั้ง</p>⁠
        <div id="result-details" style="text-align: left; max-height: 130px; overflow-y: auto; margin-bottom: 10px; font-size: 13px;"></div>
        <button onclick="goToScreen(2)">เลือกหมวดหมู่ใหม่</button>
    </div>
</div>

<script>
  
    const quizData = {
        'ฟิสิกส์': [
            { img: 'https://i.postimg.cc/QCqq0Rkx/IMG-6271.jpg', answer: '4.64วินาที' },  
            { img: 'https://i.postimg.cc/05txBrWg/IMG-6272.jpg', answer: '865m' }, 
            { img: 'https://i.postimg.cc/PqkkwDxR/IMG-6273.jpg', answer: '850' },  
            { img: 'https://i.postimg.cc/sXrhy7B3/mi-m-ch-x-16-20261019125815.jpg', answer: '1วินาที' },
            { img: 'https://i.postimg.cc/WbGM6LpQ/IMG-6292.jpg', answer: '8.94' },
            { img: 'https://i.postimg.cc/jj5PbDHB/IMG-6293.jpg', answer: '0.2s' },
            { img: 'https://i.postimg.cc/9037Z164/IMG-6294.jpg', answer: '440m' },
            { img: 'https://i.postimg.cc/59vvbdzf/IMG-6295.jpg', answer: '7 จุด' },
            { img: 'https://i.postimg.cc/LsnYWrR6/IMG-6296.jpg', answer: '1000m' },
            { img: 'https://i.postimg.cc/vTd4cTnm/IMG-6297.jpg', answer: '80cm' }
        ],
        'อังกฤษ': [
            { img: 'https://i.postimg.cc/HnSFSBsp/IMG-6422.jpg', answer: 'A' },
            { img: 'https://i.postimg.cc/sxnbnwD2/1792657708616.jpg', answer: 'A' },
            { img: 'https://i.postimg.cc/CLXQzZZz/1792657709664.jpg', answer: 'C' },
            { img: 'https://i.postimg.cc/kXBHJNgz/IMG-6423.jpg', answer: 'C' },
            { img: 'https://i.postimg.cc/SNBgmw5M/1792657710628.jpg', answer: 'painted' },
            { img: 'https://i.postimg.cc/bNkBSy11/IMG-6424.jpg', answer: 'A' },
            { img: 'https://i.postimg.cc/50DsjT0H/IMG-6425.jpg', answer: 'B' },
            { img: 'https://i.postimg.cc/bv7nnhx9/IMG-6426.jpg', answer: 'S2-S4-S1-S3' },
            { img: 'https://i.postimg.cc/gjk2XSTz/IMG-6427.jpg', answer: 'B' },
            { img: 'https://i.postimg.cc/ZKnqJQNw/IMG-6428.jpg', answer: 'C' }
        ],
        'คณิตศาสตร์': [
            { img: 'https://i.postimg.cc/yYcGmvrN/1792507168020.jpg', answer: '9.76' },
            { img: 'https://i.postimg.cc/nLcwtZVQ/1792507170473.jpg', answer: '61.75' },
            { img: 'https://i.postimg.cc/59FKJsJ5/1792507172381.jpg', answer: '1,225คน' },
            { img: 'https://i.postimg.cc/CKQJTq6W/1792507283889.jpg', answer: '512' },
            { img: 'https://i.postimg.cc/X7k8NhzQ/1792507284983.jpg', answer: '2คน' },
            { img: 'https://i.postimg.cc/tTL9crTR/1792542076949.jpg', answer: '86คน' },
            { img: 'https://i.postimg.cc/Xq8C3MYX/1792507382867.jpg', answer: 'ข้อ3' },
            { img: 'https://i.postimg.cc/C1pBqMZz/1792507383951.jpg', answer: '26วัน' },
            { img: 'https://i.postimg.cc/B68qMWJt/1792542075879.jpg', answer: '55,000บาท' },
            { img: 'https://i.postimg.cc/d0VQZkXf/1792542075013.jpg', answer: '90แบบ' }
        ]
    };

    let currentCategory = '';
    const TOTAL_QUESTIONS = 10;
    let currentPosition = 1;
    let totalTimeSpent = 0;
    let timerInterval;
    let timeLeft = 60;
    let gameLogs = [];
    let wrongCount = 0;

    function goToScreen(screenNumber) {
        document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
        document.getElementById(`screen-${screenNumber}`).classList.add('active');
    }

    function startQuiz(category) {
        currentCategory = category;
        currentPosition = 1;
        totalTimeSpent = 0;
        wrongCount = 0;
        gameLogs = [];
        goToScreen(3);
        updateBoardUI();
        loadQuestion();
    }

    function updateBoardUI() {
        for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
            let cell = document.getElementById(`cell-${i}`);
            if (cell) cell.innerHTML = i;
        }
        if (currentPosition >= 1 && currentPosition <= 9) {
            let targetCell = document.getElementById(`cell-${currentPosition}`);
            if (targetCell) {
                targetCell.innerHTML = `<img src = "https://i.postimg.cc/xj5ksmDt/d-sin-th-y-ngmi-di-t-ngch-x.png" class="player-avatar" style="width: 60px; height: 60px;" alt="player">`;
            }
        }
    }

    function loadQuestion() {
        if (currentPosition > TOTAL_QUESTIONS) {
            endQuiz();
            return;
        }
        updateBoardUI();
        let q = quizData[currentCategory][currentPosition - 1];
        document.getElementById('question-title').innerText = `[${currentCategory}] โจทย์ข้อที่ ${currentPosition} / ${TOTAL_QUESTIONS}`;
        document.getElementById('quiz-image').src = q.img;
        document.getElementById('answer-input').value = '';

        timeLeft = 60;
        document.getElementById('timer-text').innerText = `เวลา: ${timeLeft} วินาที`;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-text').innerText = `เวลา: ${timeLeft} วินาที`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                processAnswer(false, true);
            }
        }, 1000);
    }

    function submitAnswer() {
        clearInterval(timerInterval);
        let userAnswer = document.getElementById('answer-input').value.trim().toLowerCase();
        let correctAnswer = quizData[currentCategory][currentPosition - 1].answer.toLowerCase();
        let isCorrect = (userAnswer === correctAnswer);
        processAnswer(isCorrect, false);
    }

    function processAnswer(isCorrect, isTimeout) {
        let timeUsed = 60 - timeLeft;
        totalTimeSpent += timeUsed;
        let oldPos = currentPosition;

        if (isCorrect) {
            currentPosition++;
            gameLogs.push(`ข้อที่ ${oldPos}: ตอบถูก ✅ `);
        } else {
          wrongCount++;
            if (currentPosition > 1) {
                currentPosition--;
                gameLogs.push(`ข้อที่ ${oldPos}: ตอบผิด ❌ `);
            } else {
                gameLogs.push(`ข้อที่ ${oldPos}: ตอบผิด ❌ `);
            }
        }

        if (currentPosition > TOTAL_QUESTIONS) {
            currentPosition = TOTAL_QUESTIONS;
            updateBoardUI();
            setTimeout(endQuiz, 500);
        } else {
            loadQuestion();
        }
    }

    function endQuiz() {
        clearInterval(timerInterval);
        goToScreen(4);
        document.getElementById('total-time-text').innerText = `เวลารวมทั้งหมด: ${totalTimeSpent} วินาที`;
        document.getElementById('wrong-time-text').innerText = `ตอบผิด: ${wrongCount} ครั้ง`
        let detailsHTML = '';
        gameLogs.forEach((log, index) => {
            detailsHTML += `ข้อที่ ${index + 1}: ${log}<br>`;
        });
        document.getElementById('result-details').innerHTML = detailsHTML;
    }
</script>

</body>
</html>
